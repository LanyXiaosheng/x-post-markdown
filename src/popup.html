<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X 帖子导出</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <div class="brand">
        <span class="brand-mark">𝕏</span>
        <div>
          <h1>帖子导出</h1>
          <p>批量保存为本地 Markdown</p>
        </div>
      </div>

      <section class="scan-panel" aria-labelledby="scan-title">
        <div class="scan-head">
          <strong id="scan-title">正在识别当前页面…</strong>
          <label class="select-all">
            <input id="select-all" type="checkbox" checked>
            <span>全选</span>
          </label>
        </div>
        <div class="filters" aria-label="内容类型筛选">
          <label class="filter-option">
            <input id="filter-post" type="checkbox" checked>
            <span>帖子</span>
            <em id="post-count">0</em>
          </label>
          <label class="filter-option">
            <input id="filter-comment" type="checkbox" checked>
            <span>评论</span>
            <em id="comment-count">0</em>
          </label>
        </div>
        <div id="post-list" class="post-list" aria-live="polite"></div>
      </section>

      <button id="export" class="primary" type="button" disabled>导出选中帖子</button>
      <p id="status" class="status">正在扫描当前页面已加载的帖子…</p>
      <p class="hint">默认全选；只会识别当前页面已经加载出来的帖子。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
