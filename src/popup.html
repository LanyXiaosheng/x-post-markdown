<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X 帖子导出</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <div class="brand">
        <span class="brand-mark">𝕏</span>
        <div>
          <h1>帖子导出</h1>
          <p>保存为本地 Markdown</p>
        </div>
      </div>
      <button id="export" class="primary">导出当前帖子</button>
      <p id="status" class="status">请先打开 X 帖子页面。</p>
      <p class="hint">也可以在帖子上悬停，直接点击“导出 MD”。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
