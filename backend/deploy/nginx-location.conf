# Add inside the EXISTING HTTPS server for lanyxiaosheng.cloud.
# Preserve existing root locations, certificate configuration and bookflow proxy.
# TLS must terminate with the existing trusted public certificate.
location ^~ /xmd-api/ {
    # No URI suffix/trailing slash: preserve /xmd-api/v1/... upstream.
    proxy_pass http://127.0.0.1:8219;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 128k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    # Installation UUIDs and order IDs must not enter query-string access logs.
    access_log off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
